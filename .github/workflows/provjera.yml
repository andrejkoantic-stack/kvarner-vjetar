name: Preluk provjera svakih 6h

on:
  schedule:
    - cron: '0 10,16,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analiziraj:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj biblioteke
        run: pip install requests pillow numpy opencv-python-headless

      - name: Pokreni analizu za Preluk
        run: |
          python analiza.py
          cat status.json

      - name: Spremi rezultate natrag na GitHub
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add status.json
          git add dan*.png 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Ažuriranje Preluk 3 dana"
          git push
