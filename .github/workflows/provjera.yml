name: Preluk provjera svakih 6h

on:
  schedule:
    - cron: '0 */6 * * *' # Svakih 6 sati
  workflow_dispatch:       # Ručno pokretanje za test

permissions:
  contents: write

jobs:
  analiziraj:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj biblioteke
        run: pip install requests pillow numpy opencv-python-headless

      - name: Pokreni analizu za Preluk
        run: python analiza.py

      - name: Spremi rezultate natrag na GitHub
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add status.json dan1.png dan2.png dan3.png || true
          git diff --staged --quiet || git commit -m "Ažuriranje Preluk 3 dana"
          git push
