<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Preluk Vjetar</title>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      const statusEl = document.getElementById('push-status');
      function prikaziId(id) {
        if (id) {
          statusEl.textContent = "Obavijesti aktivne (ID: " + id.slice(0, 8) + "...)";
          statusEl.style.color = "#4ade80";
        }
      }
      try {
        await navigator.serviceWorker.register("/kvarner-vjetar/OneSignalSDKWorker.js", {
          scope: "/kvarner-vjetar/"
        });
        await OneSignal.init({
          appId: "b0d8dbcf-f719-4876-8bf5-6900a5fc082c",
          serviceWorkerParam: { scope: "/kvarner-vjetar/" },
          serviceWorkerPath: "kvarner-vjetar/OneSignalSDKWorker.js",
        });
        OneSignal.User.PushSubscription.addEventListener("change", (event) => {
          prikaziId(event.current.id);
        });
        prikaziId(OneSignal.User.PushSubscription.id);
      } catch (e) {
        statusEl.textContent = "Greška SW/init: " + e.message;
        statusEl.style.color = "#f87171";
      }
    });

    function ukljuciObavijesti() {
      const statusEl = document.getElementById('push-status');
      statusEl.textContent = "Prijavljivanje...";
      window.OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.Notifications.requestPermission();
          await OneSignal.User.PushSubscription.optIn();
          setTimeout(async () => {
            const id = OneSignal.User.PushSubscription.id;
            if (id) {
              statusEl.textContent = "Uspješno prijavljeno! (ID: " + id.slice(0, 8) + "...)";
              statusEl.style.color = "#4ade80";
            } else {
              const regs = await navigator.serviceWorker.getRegistrations();
              const swInfo = regs.length ? "SW aktivan (" + regs.length + ")" : "SW nije registriran";
              statusEl.textContent = "Nema ID-a | " + swInfo + " | Dozvola: " + Notification.permission;
              statusEl.style.color = "#facc15";
            }
          }, 4000);
        } catch (e) {
          statusEl.textContent = "Greška: " + e.message;
          statusEl.style.color = "#f87171";
        }
      });
    }
  </script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .okvir { max-width: 440px; margin: 0 auto; }
    h2 { text-align: center; margin-bottom: 6px; }
    .gumb { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; margin-bottom: 6px; cursor: pointer; }
    #push-status { text-align: center; font-size: 0.85rem; color: #94a3b8; margin-bottom: 14px; min-height: 18px; }
    .sazetak { background: #1e293b; padding: 14px; border-radius: 12px; text-align: center; font-weight: bold; margin-bottom: 16px; border: 1px solid #334155; }
    .dan { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .zaglavlje { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .bedz { padding: 4px 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; }
    .da { background: #16a34a; color: white; }
    .ne { background: #dc2626; color: white; }
    .oznaka { font-size: 0.85rem; color: #94a3b8; margin-top: 10px; }
    img { width: 100%; border-radius: 8px; border: 1px solid #334155; margin-top: 6px; }
    .meta { color: #94a3b8; font-size: 0.85rem; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="okvir">
    <h2>Preluk – 3 dana (06–10h)</h2>
    <button class="gumb" onclick="ukljuciObavijesti()">Uključi Push obavijesti</button>
    <div id="push-status"></div>
    <div id="sazetak" class="sazetak">Učitavanje...</div>
    <div id="lista"></div>
    <div id="vrijeme" class="meta"></div>
  </div>
  <script>
    fetch('status.json?t=' + Date.now())
      .then(r => r.json())
      .then(d => {
        document.getElementById('sazetak').textContent = d.sazetak;
        document.getElementById('vrijeme').textContent = 'Zadnja provjera: ' + d.azurirano;
        const lista = document.getElementById('lista');
        lista.innerHTML = '';
        (d.dani || []).forEach(dan => {
          const klasa = dan.povoljno ? 'da' : 'ne';
          const t = Date.now();
          lista.innerHTML += `
            <div class="dan">
              <div class="zaglavlje">
                <strong>Preluk ${dan.dan} (${dan.datum})</strong>
                <span class="bedz ${klasa}">${dan.status_tekst.toUpperCase()}</span>
              </div>
              <div class="oznaka">Lokalno (Opa): Vjetar ${dan.vjetar_posto}% | Smjer S: ${dan.smjer_posto}%</div>
              ${dan.slika ? `<img src="${dan.slika}?t=${t}" alt="Lokalno Opa">` : ''}
              <div class="oznaka">Šire (Kvarner): Vjetar ${dan.vjetar_siroko ?? 0}% | Smjer S: ${dan.smjer_siroko ?? 0}%</div>
              ${dan.slika_siroko ? `<img src="${dan.slika_siroko}?t=${t}" alt="Šire Kvarner">` : ''}
            </div>`;
        });
      })
      .catch(() => {
        document.getElementById('sazetak').textContent = 'Još nema podataka. Pokreni prvi test u GitHub Actions.';
      });
  </script>
</body>
</html>
